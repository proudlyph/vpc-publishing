name: Remove the line under the VPC mobile logo
on:
  push:
    paths:
      - '.github/workflows/vpc-mobile-wall-clean.yml'
permissions:
  contents: write
jobs:
  publish-wall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Apply the inspected wall retouch
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import base64
          from io import BytesIO
          from pathlib import Path
          from PIL import Image, ImageChops

          scene = Path('assets/vpc-scene/vpc-scene-mobile-single-shelf.webp')
          artwork = Image.open(scene).convert('RGB')
          assert artwork.size == (941, 1262)
          patch = Image.open(BytesIO(base64.b64decode(''))).convert('RGB')
          assert patch.size == (346, 200)
          result = artwork.copy()
          result.paste(patch, (510, 270))
          assert ImageChops.difference(result, artwork).getbbox() == (510, 270, 856, 470)
          result.save(scene.with_name('vpc-scene-mobile-wall-clean.webp'), lossless=True)

          page = Path('index.html')
          html = page.read_bytes()
          old = b'assets/vpc-scene/vpc-scene-mobile-logo-first.webp'
          new = b'assets/vpc-scene/vpc-scene-mobile-wall-clean.webp'
          assert html.count(old) == 1 and new not in html
          page.write_bytes(html.replace(old, new))
          PYTHON
          git diff --check
          git add index.html assets/vpc-scene/vpc-scene-mobile-wall-clean.webp
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Remove the visible line below the mobile wall logo'
          git push origin HEAD:main
