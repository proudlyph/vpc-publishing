name: Preview-only VPC mobile logo and lower shelf seam correction
on:
  push:
    paths:
      - '.github/workflows/vpc-preview-logo-shelf-20261121.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install preview tools
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<12" "numpy>=1.26,<3"
      - name: Generate preview without committing changes
        run: |
          python - <<'PY'
          from PIL import Image,ImageDraw,ImageFilter
          from pathlib import Path
          import io,base64,numpy as np
          source=Path('assets/vpc-scene/vpc-scene-mobile-no-stitch-reflow-20261120.webp')
          im=Image.open(source).convert('RGB')
          assert im.size==(1800,3200)
          raw=np.asarray(im).copy()
          # At the lower join, introduce a physically believable narrow wooden
          # shelf front with source wood grain. Do not blur the four book covers.
          # Source shelf is in y=1950:1980; seam starts at y=1990.
          # Candidate uses an oak face texture from existing shelf immediately
          # above the join, not invented content or another photo.
          strip=im.crop((0,1924,1800,1954))
          bar=strip.resize((1800,74),Image.Resampling.BICUBIC)
          bar_arr=np.array(bar)
          # Darken its underside (wood thickness), preserving source grain
          for row in range(74):
            fac=1.03 if row<12 else (1.0-0.30*(row-12)/62)
            bar_arr[row]=np.uint8(np.clip(bar_arr[row]*fac,0,255))
          raw[1968:2042]=bar_arr
          candidate=Image.fromarray(raw)
          def emit(name,pic):
            pic=pic.resize((450,800),Image.Resampling.LANCZOS)
            b=io.BytesIO();pic.save(b,'JPEG',quality=68,optimize=True)
            print('PREVIEW_START:'+name)
            print(base64.b64encode(b.getvalue()).decode())
            print('PREVIEW_END:'+name)
          emit('before',im)
          emit('after',candidate)
          # produce wall crop at 2x relative browser mobile render, for logo
          # positioning conceptual validation; browser CSS must override old rule
          print('TARGET_LOGO_DESKTOP_PERCENT',42)
          print('TARGET_LOGO_MOBILE_PERCENT',25.0)
          PY
