name: Publish VPC mobile logo above the publisher name
on:
  push:
    paths:
      - '.github/workflows/vpc-mobile-logo-first.yml'
permissions:
  contents: write
jobs:
  publish-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Apply verified mobile layout
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = e9f033007a5a0a6f3225adb691f6516a8de57644
          test "$(git hash-object assets/vpc-scene/vpc-scene-mobile-single-shelf.webp)" = c806c5a5679d3482eabc33dc7c60603775004558
          python - <<'PYTHON'
          from pathlib import Path
          import base64
          from io import BytesIO
          from PIL import Image

          scene = Path('assets/vpc-scene/vpc-scene-mobile-single-shelf.webp')
          artwork = Image.open(scene).convert('RGB')
          assert artwork.size == (941, 1262)
          wall = Image.open(BytesIO(base64.b64decode('')))
          artwork.paste(wall, (510, 275))
          artwork.save(scene.with_name('vpc-scene-mobile-logo-first.webp'), lossless=True)

          page = Path('index.html')
          html = page.read_text(encoding='utf-8')
          replacements = {
              'assets/vpc-scene/vpc-scene-mobile-single-shelf.webp': 'assets/vpc-scene/vpc-scene-mobile-logo-first.webp',
              '''    top: 37.5% !important;
              width: 10% !important;''': '''    top: auto !important;
              bottom: 64% !important;
              width: min(25%, 73px) !important;
            }

            #office .approved-scene .vpc-mobile-wall-name {
              display: block;
              position: absolute;
              z-index: 5;
              left: 72.5%;
              top: 36.8%;
              transform: translateX(-50%);
              color: #3b2412;
              font: 700 10px/1.2 Arial, sans-serif;
              white-space: nowrap;
              pointer-events: none;''',
              '<style id="vpc-mobile-single-shelf">': '''<style id="vpc-mobile-single-shelf">
          .vpc-mobile-wall-name { display: none; }''',
              '<button class="art-hotspot art-book art-book-1"': '    <span class="vpc-mobile-wall-name" aria-hidden="true">VPC PUBLISHING</span>\n    <button class="art-hotspot art-book art-book-1"',
          }
          for old, new in replacements.items():
              assert html.count(old) == 1, old
              html = html.replace(old, new, 1)
          page.write_text(html, encoding='utf-8')
          PYTHON
          git diff --check
          git add index.html assets/vpc-scene/vpc-scene-mobile-logo-first.webp
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Place the original logo above VPC Publishing on mobile'
          git push origin HEAD:main
