name: Correct VPC logo to understated wall emblem
on:
  push:
    paths:
      - '.github/workflows/vpc-remove-logo-plaque-20261119.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Only remove decorative framing and realign original logo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          assert 'vpc-wall-logo-plaque-correction-20261119' in html
          assert 'vpc-kit-original-logo-only-20261119' in html
          assert 'vpc-original-logo-discreet-20261119' not in html
          assert html.count('class="vpc-kit-wall-logo"')==1
          assert html.count('class="art-hotspot art-book art-book-')==4
          assert html.count('assets/vpc-scene/vpc-scene-mobile-no-blur-20261119.webp')==1
          assert html.count('assets/vpc-scene/vpc-scene-desktop-clean-upper-edges-20261118.webp')==1
          for i in range(4):
              assert html.count(f'data-book="{i}" onclick="openReader({i})"')==1
          logo=Path('assets/vpc-kit-original-logo.png')
          b=logo.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='c7b7f5f007bbae4e75bd472f419295f15f39b854'
          fix="""
          <style id="vpc-original-logo-discreet-20261119">
          /* Preserve Kit's exact logo pixels. No extraneous rings, plaque, shadows,
             or button appearance. It sits within the empty back wall. */
          #office .office-frame.approved-scene > img.vpc-kit-wall-logo {
            left:85%!important;
            top:36.5%!important;
            width:5.6%!important;
            height:auto!important;
            box-sizing:border-box!important;
            padding:0!important;
            border:0!important;
            border-radius:0!important;
            background:transparent!important;
            box-shadow:none!important;
            filter:none!important;
            mix-blend-mode:multiply!important;
            opacity:.88!important;
            transform:translateX(-50%)!important;
            object-fit:contain!important;
            image-rendering:auto!important;
            pointer-events:none!important;
            z-index:4!important;
          }
          @media(max-width:700px) {
            #office .office-frame.approved-scene > img.vpc-kit-wall-logo {
              left:72.5%!important;
              top:34%!important;
              width:10%!important;
            }
          }
          </style>
          """
          assert html.count('</head>')==1
          html=html.replace('</head>',fix+'</head>',1)
          p.write_text(html,encoding='utf-8')
          print('Removed added plaque, frame and shadow; original circle and artwork remain untouched.')
          print('No scene asset, book art, CSS ratio, click area, reader, or links changed.')
          PY
          git diff --check
      - name: Commit only HTML CSS correction
        shell: bash
        run: |
          set -euo pipefail
          git add index.html
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Remove artificial plaque and frame from original VPC wall emblem'
            git push origin HEAD:main
          fi
