name: Apply VPC mobile reader layout fix
on:
  push:
    paths:
      - .github/workflows/vpc-mobile-layout.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix-mobile-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make narrowly scoped mobile reader fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="smallCaps(g,'Select a volume • turn the pages',.80)"
          marker='vpc-mobile-reader-20261115'
          if marker in s:
              print("Already patched; no changes")
              raise SystemExit(0)
          assert s.count(old)==1, "Expected exactly one unwanted caption"
          assert s.count("</head>")==1, "Unexpected HTML head structure"
          s=s.replace(old,"/* Introductory spread: no redundant volume-selection instruction. */")
          style="""<style id="vpc-mobile-reader-20261115">
          @media (max-width:700px){
            #reader .reader-stage{
              height:100dvh!important; min-height:0!important; box-sizing:border-box!important;
              padding:74px 8px 54px!important;
              display:flex!important; align-items:center!important; justify-content:center!important;
            }
            #reader .book-wrap{
              flex:none!important; width:min(96vw,calc((100dvh - 150px) * 1.48))!important;
              height:auto!important; aspect-ratio:1.48 / 1!important;
              max-height:calc(100dvh - 150px)!important;
            }
            #reader .turn-hint{
              bottom:-29px!important; font-size:10px!important; max-width:76vw!important;
              text-align:center!important; letter-spacing:0!important;
            }
            #reader .spread-counter{bottom:-29px!important;font-size:10px!important;right:2%!important;}
          }
          @media (max-width:380px){
            #reader .turn-hint{font-size:9px!important;max-width:78vw!important;}
            #reader .spread-counter{font-size:9px!important;}
          }
          </style>
          """
          s=s.replace("</head>",style+"</head>")
          assert s.count(marker)==1 and old not in s
          p.write_text(s,encoding="utf-8")
          print("Patched mobile reader; bytes:",p.stat().st_size)
          
          PY
      - name: Commit corrected HTML if changed
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Fix mobile VPC reader spacing and remove redundant intro caption"
            git push
          fi
